<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a4a4a">
<title>Car Wash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@500;600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="#"><img src="assets/carwash-logo.png" alt="Carwash" width="833" height="128"></a>
    <nav class="menu"><a id="mPrice" href="#prices"></a><a id="mXml" download="cjenik.xml">XML</a></nav>
  </div>
</header>
<section class="mast">
  <nav id="langs" class="langs" aria-label="Language"></nav>
  <h1 id="title"></h1>
  <p id="hint" class="hint"></p>
  <section class="exch" id="exchange"></section>
</section>

<main class="stage">
  <section class="warn" id="warn"></section>
  <figure class="machine" id="machine">
    <div class="frame" id="mframe"></div>
    <div class="coins coins--d" id="coinsD"></div>
    <button class="zoom-btn" id="zoomBtn" aria-label="Zoom"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5M10.5 8v5M8 10.5h5"/></svg></button>
  </figure>
  <div class="content">
    <div class="coins coins--m" id="coinsM"></div>
    <section id="programs" class="programs"></section>
    <section class="prices" id="prices"></section>
    <a id="rate" class="rate" href="https://www.google.com/search?q=autopraonica+split" target="_blank" rel="noopener"></a>
  </div>
</main>
<section class="devices" id="devices"></section>
<footer class="foot" id="foot"></footer>
<a class="rp-fab" id="rpFab" href="report.html"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 21h20z"/><path d="M12 10v5M12 18v.5"/></svg><span id="rpBtn"></span></a>
<div class="go2" id="go2"></div>
<canvas id="flow" aria-hidden="true"></canvas>
<span id="credit" class="sr" aria-live="polite"></span>

<dialog id="zoom" class="zoom"><button id="zoomClose" aria-label="Close">&times;</button><div class="zscroll"><div id="zbox"></div></div></dialog>
<script src="data.js"></script>
<script src="rp.js"></script>
<script src="app.js"></script>
</body>
</html>
